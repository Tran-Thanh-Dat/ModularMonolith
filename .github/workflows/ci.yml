name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            ModularMonolith.sln

      - name: Restore
        run: dotnet restore ModularMonolith.sln

      - name: Build
        run: dotnet build ModularMonolith.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ModularMonolith.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Dependency vulnerability scan (non-blocking)
        continue-on-error: true
        run: dotnet list ModularMonolith.sln package --vulnerable --include-transitive

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/*.trx"
          if-no-files-found: ignore

      - name: Publish ApiHost
        run: dotnet publish src/ApiHost/ApiHost.csproj --configuration Release --output ./publish --no-build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: modular-monolith-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Docker Compose
        run: docker compose config --quiet

  # Optional future job: enable PostgreSQL/Redis integration tests with Testcontainers.
